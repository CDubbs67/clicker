<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade Hub | Speed Run & Clicker</title>
    <meta name="description" content="A premium arcade hub featuring high-precision speed run timing and a satisfying spacebar clicker.">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="bg-glow"></div>
    
    <main id="app">
        <!-- Main Menu -->
        <section id="menu-screen" class="screen active">
            <h1 class="title">ARCADE<span>HUB</span></h1>
            <div class="button-grid">
                <button id="btn-speedrun" class="menu-card">
                    <div class="icon">⏱️</div>
                    <h2>Speed Run</h2>
                    <p>Test your reaction time. Press space or click to start/stop.</p>
                    <div class="stat-badge">Best: <span id="best-time-display">--.---</span>s</div>
                </button>
                <button id="btn-clicker" class="menu-card">
                    <div class="icon">💰</div>
                    <h2>Clicker</h2>
                    <p>How fast can you tap? Press space or click to earn coins.</p>
                    <div class="stat-badge">Coins: <span id="total-clicks-display">0</span></div>
                </button>
            </div>
            <div class="daily-code-container">
                <span class="daily-label">Daily Gift Code:</span>
                <span class="daily-value">DYLAN</span>
            </div>

            <div class="gift-code-section">
                <input type="text" id="gift-input" placeholder="Enter Gift Code...">
                <button id="redeem-btn">Redeem</button>
            </div>
            <button id="view-codes-btn" class="info-link">View All Codes</button>
            
            <button id="reset-all-btn" class="danger-link">Reset All Progress</button>
        </section>

        <!-- Codes Modal -->
        <div id="codes-modal" class="modal-overlay">
            <div class="modal-content">
                <button class="close-modal">&times;</button>
                <h2>Active Gift Codes</h2>
                <div class="codes-grid" id="codes-list">
                    <!-- Codes will be injected here -->
                </div>
            </div>
        </div>

        <!-- Speed Run Screen -->
        <section id="speedrun-screen" class="screen">
            <button class="back-btn">← Back</button>
            <div class="game-container">
                <div class="mode-label">Speed Run</div>
                <div id="timer-display" class="big-number">0.000</div>
                <div class="instructions">Press <span class="key">SPACE</span> or <span class="key">CLICK</span> to Start / Stop</div>
                <div class="personal-best">Best: <span id="pb-display">--.---</span>s</div>
            </div>
        </section>

        <!-- Clicker Screen -->
        <section id="clicker-screen" class="screen">
            <button class="back-btn">← Back</button>
            <div class="game-container clicker-layout">
                <div class="miner-section">
                    <div class="mode-label">Coin Miner</div>
                    <div id="click-count" class="big-number">🪙 0</div>
                    <div class="instructions">Press <span class="key">SPACE</span> or <span class="key">CLICK</span> to earn Coins</div>
                    <div class="multiplier-label">Current: +<span id="mult-display">1</span> per click</div>
                </div>
                
                <div class="upgrades-panel">
                    <h3>Upgrades</h3>
                    <div class="upgrade-list">
                        <button class="upgrade-item" data-cost="5000" data-mult="4">
                            <div class="u-info">
                                <span class="u-name">Power Click</span>
                                <span class="u-desc">4 per click</span>
                            </div>
                            <span class="u-price">🪙 5,000</span>
                        </button>
                        <button class="upgrade-item" data-cost="25000" data-mult="14">
                            <div class="u-info">
                                <span class="u-name">Mega Miner</span>
                                <span class="u-desc">14 per click</span>
                            </div>
                            <span class="u-price">🪙 25,000</span>
                        </button>
                        <button class="upgrade-item" data-cost="100000" data-mult="50">
                            <div class="u-info">
                                <span class="u-name">Ultra Drill</span>
                                <span class="u-desc">50 per click</span>
                            </div>
                            <span class="u-price">🪙 100,000</span>
                        </button>
                        <button class="upgrade-item" data-cost="500000" data-mult="250">
                            <div class="u-info">
                                <span class="u-name">Quantum Extractor</span>
                                <span class="u-desc">250 per click</span>
                            </div>
                            <span class="u-price">🪙 500,000</span>
                        </button>
                        <button class="upgrade-item" data-cost="2500000" data-mult="1250">
                            <div class="u-info">
                                <span class="u-name">Galactic Forge</span>
                                <span class="u-desc">1,250 per click</span>
                            </div>
                            <span class="u-price">🪙 2,500,000</span>
                        </button>
                        <button class="upgrade-item" data-cost="10000000" data-mult="5000">
                            <div class="u-info">
                                <span class="u-name">Stellar Siphon</span>
                                <span class="u-desc">5,000 per click</span>
                            </div>
                            <span class="u-price">🪙 10,000,000</span>
                        </button>
                        <button class="upgrade-item" data-cost="50000000" data-mult="25000">
                            <div class="u-info">
                                <span class="u-name">Cosmic Harvester</span>
                                <span class="u-desc">25,000 per click</span>
                            </div>
                            <span class="u-price">🪙 50,000,000</span>
                        </button>
                        <button class="upgrade-item" data-cost="250000000" data-mult="125000">
                            <div class="u-info">
                                <span class="u-name">Dimension Ripper</span>
                                <span class="u-desc">125,000 per click</span>
                            </div>
                            <span class="u-price">🪙 250,000,000</span>
                        </button>
                        <button class="upgrade-item" data-cost="1000000000" data-mult="1000000">
                            <div class="u-info">
                                <span class="u-name">Universe Eater</span>
                                <span class="u-desc">1,000,000 per click</span>
                            </div>
                            <span class="u-price">🪙 1,000,000,000</span>
                        </button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
