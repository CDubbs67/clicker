<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade Hub | Speed Run & Clicker</title>
    <meta name="description" content="A premium arcade hub featuring high-precision speed run timing and a satisfying spacebar clicker.">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="bg-glow"></div>
    
    <main id="app">
        <!-- Main Menu -->
        <section id="menu-screen" class="screen active">
            <h1 class="title">ARCADE<span>HUB</span></h1>
            <div class="button-grid">
                <button id="btn-speedrun" class="menu-card">
                    <div class="icon">⏱️</div>
                    <h2>Speed Run</h2>
                    <p>Test your reaction time. Press space to start/stop.</p>
                    <div class="stat-badge">Best: <span id="best-time-display">--.---</span>s</div>
                </button>
                <button id="btn-clicker" class="menu-card">
                    <div class="icon">💰</div>
                    <h2>Clicker</h2>
                    <p>How fast can you tap? Press space to earn coins.</p>
                    <div class="stat-badge">Coins: <span id="total-clicks-display">0</span></div>
                </button>
            </div>
            <div class="gift-code-section">
                <input type="text" id="gift-input" placeholder="Enter Gift Code...">
                <button id="redeem-btn">Redeem</button>
            </div>
            
            <button id="reset-all-btn" class="danger-link">Reset All Progress</button>
        </section>

        <!-- Speed Run Screen -->
        <section id="speedrun-screen" class="screen">
            <button class="back-btn">← Back</button>
            <div class="game-container">
                <div class="mode-label">Speed Run</div>
                <div id="timer-display" class="big-number">0.000</div>
                <div class="instructions">Press <span class="key">SPACE</span> to Start / Stop</div>
                <div class="personal-best">Best: <span id="pb-display">--.---</span>s</div>
            </div>
        </section>

        <!-- Clicker Screen -->
        <section id="clicker-screen" class="screen">
            <button class="back-btn">← Back</button>
            <div class="game-container clicker-layout">
                <div class="miner-section">
                    <div class="mode-label">Coin Miner</div>
                    <div id="click-count" class="big-number">🪙 0</div>
                    <div class="instructions">Press <span class="key">SPACE</span> to earn Coins</div>
                    <div class="multiplier-label">Current: +<span id="mult-display">1</span> per click</div>
                </div>
                
                <div class="upgrades-panel">
                    <h3>Upgrades</h3>
                    <div class="upgrade-list">
                        <button class="upgrade-item" data-cost="1000" data-mult="1">
                            <div class="u-info">
                                <span class="u-name">Double Click</span>
                                <span class="u-desc">+1 per click</span>
                            </div>
                            <span class="u-price">🪙 1,000</span>
                        </button>
                        <button class="upgrade-item" data-cost="5000" data-mult="3">
                            <div class="u-info">
                                <span class="u-name">Power Click</span>
                                <span class="u-desc">+3 per click</span>
                            </div>
                            <span class="u-price">🪙 5,000</span>
                        </button>
                        <button class="upgrade-item" data-cost="25000" data-mult="10">
                            <div class="u-info">
                                <span class="u-name">Mega Miner</span>
                                <span class="u-desc">+10 per click</span>
                            </div>
                            <span class="u-price">🪙 25,000</span>
                        </button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
